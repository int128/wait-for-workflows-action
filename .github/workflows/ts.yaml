name: ts

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - '*.config.*'
      - graphql-codegen.*
      - .github/workflows/ts.yaml
      - .github/workflows/fixture.yaml
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - '*.config.*'
      - graphql-codegen.*
      - .github/workflows/ts.yaml
      - .github/workflows/fixture.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm test

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm build

      - id: e2e-1
        name: Run int128/wait-for-workflows-action (#1)
        continue-on-error: true
        uses: ./
        with:
          initial-delay-seconds: 0
          period-seconds: 3
          filter-workflow-names: |
            fixture
      - run: test "$WAIT_FOR_WORKFLOWS_OUTCOME" = "failure"
        env:
          WAIT_FOR_WORKFLOWS_OUTCOME: ${{ steps.e2e-1.outcome }}

      - uses: int128/rerun-workflows-action@cc8ff032980fe32e2c8d84c600de1fa0deeef7e0 # v1.18.0

      - id: e2e-2
        name: Run int128/wait-for-workflows-action (#2)
        uses: ./
        with:
          initial-delay-seconds: 0
          period-seconds: 3
          page-size-of-check-suites: 1
          filter-by-current-activity-type: true
          exclude-workflow-names: |
            wait-for-workflows

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm run check
      - run: pnpm graphql-codegen
      - uses: int128/update-generated-files-action@1d6d8fac356eabbd925f4c3cab43d871bab249cd # v2.114.0
