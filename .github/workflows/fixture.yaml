name: fixture

on:
  pull_request:
    # This must be same as ts.yaml
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - '*.config.*'
      - graphql-codegen.*
      - .github/workflows/ts.yaml

jobs:
  success-on-rerun:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - run: test "$GITHUB_RUN_ATTEMPT" = 2
